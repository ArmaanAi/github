<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Neon Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <div id="story-overlay">
            <h1>THE NEON QUEST</h1>
            <p id="story-text">
                YEAR 2099: The world is dark. The power grids have failed.<br>
                You are the last Neo-Explorer.<br><br>
                MISSION: Navigate the ancient Digital Grid and recover the Lost Power Cores.<br>
                Look for the glowing cubes of pure energy.
            </p>
            <button id="start-button">START MISSION</button>
        </div>
        <div id="instructions" style="display: none;">
            <p>W, A, S, D to move | SPACE to jump | MOUSE to look</p>
        </div>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
